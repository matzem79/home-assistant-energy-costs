name: Release draft
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tag against integration version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = json.loads(Path('custom_components/energy_costs/manifest.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag and manifest version differ')
          PY
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build_release.py
      - name: Create draft release with installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --draft --title "Energy Costs $RELEASE_TAG" --generate-notes
